<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Barlow, system-ui, sans-serif; }
    a { color: #1f5fbf; } a:hover { color: #14418a; }
  </style>
</helmet>

<div style="width: 402px; height: 874px; box-sizing: border-box; background: #fdf3e3; padding: 56px 20px 20px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

  <!-- Wordmark block -->
  <div style="background: #2f6fd0; border: 4px solid #16212e; border-radius: 22px; box-shadow: 0 6px 0 #16212e; padding: 18px 16px 20px; text-align: center;">
    <div style="font-family: Barlow, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.18em; color: #cfe2ff;">SIMULTANEOUS DICE BUILDER</div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 84px; line-height: 0.86; color: #fdf3e3; letter-spacing: 0.01em; margin-top: 6px;">FOUNDRY</div>

    <div style="display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 14px;">
      <div style="width: 44px; height: 44px; background: #fdf3e3; border: 4px solid #16212e; border-radius: 12px; display: grid; grid-template-columns: repeat(3, 1fr); place-items: center; padding: 5px; box-sizing: border-box; transform: rotate(-7deg);">
        <div style="width: 7px; height: 7px; background: #16212e; border-radius: 50%;"></div><div></div><div style="width: 7px; height: 7px; background: #16212e; border-radius: 50%;"></div>
        <div></div><div style="width: 7px; height: 7px; background: #16212e; border-radius: 50%;"></div><div></div>
        <div style="width: 7px; height: 7px; background: #16212e; border-radius: 50%;"></div><div></div><div style="width: 7px; height: 7px; background: #16212e; border-radius: 50%;"></div>
      </div>
      <div style="width: 44px; height: 44px; background: #ffc73a; border: 4px solid #16212e; border-radius: 12px; display: grid; grid-template-columns: repeat(2, 1fr); place-items: center; padding: 7px; box-sizing: border-box; transform: rotate(6deg);">
        <div style="width: 8px; height: 8px; background: #16212e; border-radius: 50%;"></div><div style="width: 8px; height: 8px; background: #16212e; border-radius: 50%;"></div>
        <div style="width: 8px; height: 8px; background: #16212e; border-radius: 50%;"></div><div style="width: 8px; height: 8px; background: #16212e; border-radius: 50%;"></div>
      </div>
      <div style="font-family: Barlow, sans-serif; font-weight: 600; font-size: 17px; color: #cfe2ff; margin-left: 4px; text-align: left; line-height: 1.15;">2–6 players<br>10 rounds · 12 min</div>
    </div>
  </div>

  <!-- Identity row -->
  <div style="display: flex; gap: 10px;">
    <div style="flex-grow: 1; background: #ffffff; border: 4px solid #16212e; border-radius: 16px; padding: 14px 16px; font-size: 19px; font-weight: 500; color: #8a8578;">Your name</div>
    <div style="width: 62px; background: #ffffff; border: 4px solid #16212e; border-radius: 16px; display: flex; align-items: center; justify-content: center;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#16212e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.33-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.08a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1Z"/></svg>
    </div>
  </div>

  <!-- Primary -->
  <div style="background: #f0803c; border: 4px solid #16212e; border-radius: 20px; box-shadow: 0 7px 0 #16212e; padding: 20px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 0.03em; color: #16212e;">HOST A MATCH</div>

  <!-- Join -->
  <div style="display: flex; gap: 10px;">
    <div style="flex-grow: 1; background: #ffffff; border: 4px solid #16212e; border-radius: 16px; padding: 14px 16px; font-size: 19px; font-weight: 500; color: #8a8578;">Join code</div>
    <div style="background: #2f6fd0; border: 4px solid #16212e; border-radius: 16px; box-shadow: 0 5px 0 #16212e; padding: 14px 18px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; color: #fdf3e3;">JOIN</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- Offline row -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <div style="background: #34b27b; border: 4px solid #16212e; border-radius: 16px; box-shadow: 0 5px 0 #16212e; padding: 14px 6px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.05; color: #16212e;">PASS &amp;<br>PLAY</div>
    <div style="background: #ffc73a; border: 4px solid #16212e; border-radius: 16px; box-shadow: 0 5px 0 #16212e; padding: 14px 6px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.05; color: #16212e;">SOLO VS<br>BOTS</div>
    <div style="background: #ffffff; border: 4px solid #16212e; border-radius: 16px; box-shadow: 0 5px 0 #16212e; padding: 14px 6px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.05; color: #16212e;">HOW TO<br>PLAY</div>
  </div>

  <div style="text-align: center; font-size: 17px; font-weight: 500; color: #6f6a5e;">Ready</div>
</div>
</x-dc>
</body>
</html>
