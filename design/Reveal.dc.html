<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Barlow, system-ui, sans-serif; }
    a { color: #cfe2ff; } a:hover { color: #ffffff; }
  </style>
</helmet>

<div style="width: 402px; height: 874px; box-sizing: border-box; background: #16212e; padding: 56px 20px 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">

  <div style="text-align: center;">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 52px; line-height: 1; color: #ffc73a; letter-spacing: 0.02em;">CONTESTED!</div>
    <div style="font-size: 19px; font-weight: 500; color: #a9b6c4; margin-top: 4px;">Two of you wanted the Draft Table</div>
  </div>

  <!-- The contested card, big and tilted -->
  <div style="display: flex; justify-content: center; margin-top: 4px;">
    <div style="width: 214px; background: #ffffff; border: 5px solid #ffc73a; border-radius: 22px; box-shadow: 0 10px 0 #8a6a12; overflow: hidden; transform: rotate(-3deg);">
      <div style="background: #ffc73a; border-bottom: 5px solid #16212e; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 700; font-size: 16px; color: #16212e;">TIER 2</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; color: #16212e;">5</span>
      </div>
      <div style="padding: 14px;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.02; color: #16212e;">DRAFT TABLE</div>
        <div style="display: flex; gap: 6px; margin: 12px 0;">
          <div style="width: 36px; height: 36px; background: #cfe2ff; border: 4px solid #2f6fd0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 21px; color: #16212e;">4</div>
          <div style="width: 36px; height: 36px; background: #cfe2ff; border: 4px solid #2f6fd0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 21px; color: #16212e;">4</div>
          <div style="width: 36px; height: 36px; background: #cfe2ff; border: 4px solid #2f6fd0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 21px; color: #16212e;">4</div>
        </div>
        <div style="font-size: 17px; font-weight: 500; line-height: 1.25; color: #3c4551;">+2 Sparks every Upkeep</div>
      </div>
    </div>
  </div>

  <!-- Claimants -->
  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 2px;">
    <div style="display: flex; align-items: center; gap: 11px; background: #34b27b; border: 4px solid #0f2a1f; border-radius: 16px; box-shadow: 0 6px 0 #0f2a1f; padding: 12px 14px;">
      <div style="width: 38px; height: 38px; background: #fdf3e3; border: 4px solid #0f2a1f; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: #16212e;">S</div>
      <div style="flex-grow: 1;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; color: #0f2a1f;">SAM TAKES IT</div>
        <div style="font-size: 16px; font-weight: 600; color: #0f2a1f; opacity: 0.75;">had priority — furthest behind</div>
      </div>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0f2a1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; background: #23303f; border: 4px solid #3c4b5c; border-radius: 16px; padding: 12px 14px;">
      <div style="width: 38px; height: 38px; background: #3c4b5c; border: 4px solid #3c4b5c; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: #a9b6c4;">A</div>
      <div style="flex-grow: 1;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; color: #a9b6c4;">AARON MISSES</div>
        <div style="font-size: 16px; font-weight: 600; color: #f0803c;">dice back — one re-pick coming</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- Uncontested strip -->
  <div style="background: #23303f; border: 4px solid #3c4b5c; border-radius: 16px; padding: 12px 14px;">
    <div style="font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: #7f8b99; margin-bottom: 7px;">NOBODY ARGUED ABOUT</div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="width: 30px; height: 30px; background: #34b27b; border: 3px solid #0f2a1f; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: #16212e;">M</div>
      <div style="font-size: 18px; font-weight: 600; color: #dfe7ef;">Mo took <strong style="color: #ffc73a;">Whetstone</strong></div>
    </div>
  </div>

  <div style="background: #f0803c; border: 4px solid #16212e; border-radius: 20px; box-shadow: 0 7px 0 #8a4218; padding: 18px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; color: #16212e;">RE-PICK →</div>
</div>
</x-dc>
</body>
</html>
