<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Barlow, system-ui, sans-serif; }
    a { color: #1f5fbf; } a:hover { color: #14418a; }
  </style>
</helmet>

<div style="width: 402px; height: 874px; box-sizing: border-box; background: #fdf3e3; padding: 52px 14px 14px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">

  <!-- Top bar -->
  <div style="display: flex; align-items: center; gap: 10px;">
    <div style="background: #16212e; border-radius: 14px; padding: 8px 14px;">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; color: #fdf3e3;">ROUND 4<span style="color: #7f8b99;">/10</span></div>
      <div style="font-family: Barlow, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.1em; color: #ffc73a;">SHAPE</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 46px; height: 46px; background: #ffffff; border: 4px solid #16212e; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16212e" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
    </div>
    <div style="background: #ffc73a; border: 4px solid #16212e; border-radius: 14px; box-shadow: 0 4px 0 #16212e; padding: 8px 14px; display: flex; align-items: center; gap: 7px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#16212e"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; color: #16212e;">7</div>
    </div>
  </div>

  <!-- Opponent rail -->
  <div style="display: flex; flex-direction: column; gap: 7px;">
    <div style="display: flex; align-items: center; gap: 9px; background: #ffffff; border: 4px solid #16212e; border-radius: 14px; padding: 8px 12px;">
      <div style="width: 30px; height: 30px; background: #f0803c; border: 3px solid #16212e; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; color: #16212e;">A</div>
      <div style="flex-grow: 1; font-weight: 600; font-size: 19px; color: #16212e;">Aaron — YOU</div>
      <div style="background: #34b27b; border: 3px solid #16212e; border-radius: 8px; padding: 2px 8px; font-weight: 700; font-size: 15px; color: #16212e;">READY</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; color: #16212e;">12</div>
    </div>
    <div style="display: flex; align-items: center; gap: 9px; background: #ffffff; border: 4px solid #16212e; border-radius: 14px; padding: 8px 12px; opacity: 0.92;">
      <div style="width: 30px; height: 30px; background: #2f6fd0; border: 3px solid #16212e; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; color: #fdf3e3;">S</div>
      <div style="flex-grow: 1; font-weight: 600; font-size: 19px; color: #16212e;">Sam</div>
      <div style="background: #fdf3e3; border: 3px solid #16212e; border-radius: 8px; padding: 2px 8px; font-weight: 700; font-size: 15px; color: #6f6a5e;">THINKING</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; color: #16212e;">9</div>
    </div>
  </div>

  <!-- Market -->
  <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 2px;">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.06em; color: #16212e;">THE MARKET</div>
    <div style="font-size: 15px; font-weight: 500; color: #6f6a5e;">tap a card to see what pays</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px;">
    <div style="background: #ffffff; border: 4px solid #16212e; border-radius: 16px; box-shadow: 0 5px 0 #16212e; overflow: hidden;">
      <div style="background: #34b27b; border-bottom: 4px solid #16212e; padding: 4px 8px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 700; font-size: 14px; color: #16212e;">T1</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: #16212e;">2</span>
      </div>
      <div style="padding: 8px;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.05; color: #16212e;">WHET&shy;STONE</div>
        <div style="display: flex; gap: 4px; margin: 7px 0;">
          <div style="width: 26px; height: 26px; background: #fdf3e3; border: 3px solid #16212e; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">12</div>
          <div style="align-self: center; font-size: 14px; font-weight: 600; color: #6f6a5e;">total</div>
        </div>
        <div style="font-size: 15px; font-weight: 500; line-height: 1.2; color: #3c4551;">Nudge a die ±1</div>
      </div>
    </div>

    <div style="background: #ffffff; border: 4px solid #2f6fd0; border-radius: 16px; box-shadow: 0 5px 0 #2f6fd0; overflow: hidden;">
      <div style="background: #ffc73a; border-bottom: 4px solid #16212e; padding: 4px 8px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 700; font-size: 14px; color: #16212e;">T2</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: #16212e;">5</span>
      </div>
      <div style="padding: 8px;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.05; color: #16212e;">DRAFT TABLE</div>
        <div style="display: flex; gap: 4px; margin: 7px 0;">
          <div style="width: 26px; height: 26px; background: #cfe2ff; border: 3px solid #2f6fd0; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">4</div>
          <div style="width: 26px; height: 26px; background: #cfe2ff; border: 3px solid #2f6fd0; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">4</div>
          <div style="width: 26px; height: 26px; background: #cfe2ff; border: 3px solid #2f6fd0; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">4</div>
        </div>
        <div style="font-size: 15px; font-weight: 500; line-height: 1.2; color: #3c4551;">+2 Sparks each Upkeep</div>
      </div>
    </div>

    <div style="background: #ffffff; border: 4px solid #16212e; border-radius: 16px; box-shadow: 0 5px 0 #16212e; overflow: hidden; opacity: 0.55;">
      <div style="background: #e58c59; border-bottom: 4px solid #16212e; padding: 4px 8px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 700; font-size: 14px; color: #16212e;">T3</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: #16212e;">9</span>
      </div>
      <div style="padding: 8px;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.05; color: #16212e;">GREAT FORGE</div>
        <div style="display: flex; gap: 4px; margin: 7px 0;">
          <div style="width: 26px; height: 26px; background: #fdf3e3; border: 3px dashed #8a8578; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #8a8578;">6</div>
          <div style="width: 26px; height: 26px; background: #fdf3e3; border: 3px dashed #8a8578; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #8a8578;">6</div>
        </div>
        <div style="font-size: 15px; font-weight: 500; line-height: 1.2; color: #3c4551;">Dice cap +1</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- Dice tray -->
  <div style="background: #ffffff; border: 4px solid #16212e; border-radius: 18px; padding: 12px;">
    <div style="font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: #6f6a5e; margin-bottom: 9px;">YOUR DICE</div>
    <div style="display: flex; gap: 9px;">
      <div style="width: 58px; height: 58px; background: #fdf3e3; border: 4px solid #16212e; border-radius: 15px; display: grid; grid-template-columns: repeat(3, 1fr); place-items: center; padding: 8px; box-sizing: border-box;">
        <div style="width: 9px; height: 9px; background: #16212e; border-radius: 50%;"></div><div></div><div style="width: 9px; height: 9px; background: #16212e; border-radius: 50%;"></div>
        <div></div><div style="width: 9px; height: 9px; background: #16212e; border-radius: 50%;"></div><div></div>
        <div style="width: 9px; height: 9px; background: #16212e; border-radius: 50%;"></div><div></div><div style="width: 9px; height: 9px; background: #16212e; border-radius: 50%;"></div>
      </div>
      <div style="width: 58px; height: 58px; background: #2f6fd0; border: 4px solid #16212e; border-radius: 15px; box-shadow: 0 0 0 4px #ffc73a; display: grid; grid-template-columns: repeat(2, 1fr); place-items: center; padding: 11px; box-sizing: border-box;">
        <div style="width: 9px; height: 9px; background: #fdf3e3; border-radius: 50%;"></div><div style="width: 9px; height: 9px; background: #fdf3e3; border-radius: 50%;"></div>
        <div style="width: 9px; height: 9px; background: #fdf3e3; border-radius: 50%;"></div><div style="width: 9px; height: 9px; background: #fdf3e3; border-radius: 50%;"></div>
      </div>
      <div style="width: 58px; height: 58px; background: #fdf3e3; border: 4px solid #16212e; border-radius: 15px; display: flex; align-items: center; justify-content: center;">
        <div style="width: 11px; height: 11px; background: #16212e; border-radius: 50%;"></div>
      </div>
      <div style="width: 58px; height: 58px; background: #efe7d6; border: 4px dashed #8a8578; border-radius: 15px; display: grid; grid-template-columns: repeat(3, 1fr); place-items: center; padding: 8px; box-sizing: border-box; opacity: 0.6;">
        <div style="width: 9px; height: 9px; background: #8a8578; border-radius: 50%;"></div><div></div><div></div>
        <div></div><div style="width: 9px; height: 9px; background: #8a8578; border-radius: 50%;"></div><div></div>
        <div></div><div></div><div style="width: 9px; height: 9px; background: #8a8578; border-radius: 50%;"></div>
      </div>
    </div>
  </div>

  <!-- Shape row -->
  <div style="display: flex; gap: 9px;">
    <div style="flex-grow: 1; background: #ffffff; border: 4px solid #16212e; border-radius: 15px; box-shadow: 0 5px 0 #16212e; padding: 13px 6px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; color: #16212e;">RE-ROLL <span style="color: #f0803c;">2⚡</span></div>
    <div style="width: 58px; background: #ffffff; border: 4px solid #16212e; border-radius: 15px; box-shadow: 0 5px 0 #16212e; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; color: #16212e;">−1</div>
    <div style="width: 58px; background: #ffffff; border: 4px solid #16212e; border-radius: 15px; box-shadow: 0 5px 0 #16212e; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; color: #16212e;">+1</div>
  </div>

  <!-- Commit -->
  <div style="display: flex; gap: 9px; align-items: stretch;">
    <div style="flex-grow: 1; background: #34b27b; border: 4px solid #16212e; border-radius: 18px; box-shadow: 0 7px 0 #16212e; padding: 17px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 0.02em; color: #16212e;">LOCK IT IN</div>
    <div style="width: 78px; background: #16212e; border: 4px solid #16212e; border-radius: 18px; box-shadow: 0 7px 0 #0b1119; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px; line-height: 1; color: #ffc73a;">12</div>
      <div style="font-size: 13px; font-weight: 600; color: #7f8b99;">SEC</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
