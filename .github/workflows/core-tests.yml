name: core-tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run core test suite
        run: dotnet run --project tools/CoreTests/CoreTests.csproj -v quiet
        env:
          DOTNET_NOLOGO: '1'
