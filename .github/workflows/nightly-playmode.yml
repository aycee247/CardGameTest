# The slow lane (STORY-6.1): the PlayMode/netcode suite, nightly rather than per-push.
# The fast per-push lane is core-tests.yml.
#
# Runs inside GameCI's Unity editor image, which needs a Unity license at activation time.
# Provide ONE of these repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   UNITY_LICENSE            — the contents of a personal .ulf license file (recommended), or
#   UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL — a serial-based (Plus/Pro) activation.
# Until one exists, this job fails fast on the first step with a pointer here.
#
# Note: GitHub pauses cron schedules after ~60 days without repository activity; a push
# re-enables them.

name: nightly-playmode

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC nightly — early morning US time, quiet hours
  workflow_dispatch: {}     # manual runs for testing the lane itself

jobs:
  playmode:
    runs-on: ubuntu-latest
    steps:
      - name: Require a Unity license secret
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '' }}
        run: |
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "::error::No Unity license secret is configured, so the editor cannot activate. Add UNITY_LICENSE (contents of a personal .ulf) or UNITY_EMAIL/UNITY_PASSWORD/UNITY_SERIAL under Settings > Secrets and variables > Actions. Setup steps: see the closing comment on issue #32."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The imported Library is the expensive part of a cold editor run; keyed on the lock file
      # so a package change rebuilds it.
      - uses: actions/cache@v4
        with:
          path: Library
          key: library-playmode-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-playmode-

      - name: Run PlayMode suite
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          testMode: playmode
          # The same filter tools/run-playmode-tests.sh applies, for the same reason: the
          # manifest's testables entry exposes NGO's own several-hundred-test suite, and an
          # unfiltered run would run Unity's tests, not ours.
          customParameters: -assemblyNames Game.PlayModeTests
          artifactsPath: playmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-results
          path: playmode-results
